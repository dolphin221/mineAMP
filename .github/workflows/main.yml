name: Build OpenSoundboard 26.1

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: |
          GRADLEW=$(find . -name "gradlew" -maxdepth 2 | head -1)
          echo "Found gradlew at: $GRADLEW"
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          echo "GRADLE_DIR=$(dirname $GRADLEW)" >> $GITHUB_ENV

      - name: Build v26.1
        run: |
          cd "$GRADLE_DIR"
          ./gradlew :versions:v26_1:build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensoundboard-26.1
          path: "**/v26_1/build/libs/*.jar"
          if-no-files-found: error
